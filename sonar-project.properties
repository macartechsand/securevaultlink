# Informações do projeto
sonar.projectKey=securelink-vault
sonar.projectName=SecureLink Vault
sonar.projectVersion=1.0

# Caminho para os arquivos fonte
sonar.sources=src
sonar.tests=src/__tests__

# Exclusões
sonar.exclusions=node_modules/**/*,build/**/*,dist/**/*,coverage/**/*

# Configurações de cobertura de código
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Configurações de análise
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.json

# Regras personalizadas de segurança
sonar.security.sources=src
sonar.security.tests=src/__tests__
sonar.security.exclusions=node_modules/**/*

# Configurações de qualidade
sonar.qualitygate.wait=true 